name: Update GitHub Profile README

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz
      
      - name: Create scripts directory if not exists
        run: mkdir -p scripts
      
      - name: Generate dynamic README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ShreyanshMishra1202
        run: python scripts/generate_readme.py
      
      - name: Check if README changed
        id: verify-changed
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.verify-changed.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "✨ chore: auto-update profile with latest GitHub stats - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
      
      - name: Display update status
        run: |
          if [ "${{ steps.verify-changed.outputs.changed }}" = "true" ]; then
            echo "✅ Profile README updated successfully!"
          else
            echo "ℹ️ No changes detected. Profile is already up-to-date."
          fi
